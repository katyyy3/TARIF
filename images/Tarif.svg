  <text class="st1" transform="translate(18.97 -1032.88)"><tspan x="0" y="0">Tarif is a typeface family inspired by the multicultural </tspan><tspan x="0" y="36">vutopia of Convivencia — the peaceful coexistence of </tspan><tspan x="0" y="72">Muslims, Christians and Jews in tenth century </tspan><tspan x="0" y="108">Andalusia, a region which played an important role in </tspan><tspan x="0" y="144">bringing to Europe the classics of Greek philosophy, </tspan><tspan x="0" y="180">together with Islamic culture and aesthetics. Designed </tspan><tspan x="0" y="216">for Zetafonts by Andrea Tartarelli, Tarif is a slab serif </tspan><tspan x="0" y="252">typeface with a humanist skeleton and inverted </tspan><tspan x="0" y="288">contrast, subtly mixing latin zeist, calligraphic details, </tspan><tspan x="0" y="324">extreme ink-traps, and postmodern unorthodox </tspan><tspan x="0" y="360">reinvention of traditional grotesque letter shapes.</tspan><tspan x="0" y="432">The design of Tarif, perfect for titling, logo and display </tspan><tspan x="0" y="468">use, is complemented by a wide range of seven weights </tspan><tspan x="0" y="504">allowing for solid editorial use and great readability in </tspan><tspan x="0" y="540">body text. Matching italics have been designed with the </tspan><tspan x="0" y="576">help of Cosimo Lorenzo Pancini, while Rania Azmi has </tspan><tspan x="0" y="612">collaborated on the design of the arabic version of Tarif, </tspan><tspan x="0" y="648">where the humanist shapes and inverted contrast of the </tspan><tspan x="0" y="684">latin letters find a natural connection with modern </tspan><tspan x="0" y="720">arabic letterforms.</tspan><tspan x="0" y="792">As buoyant as reliable, Tarif includes also a wide array </tspan><tspan x="0" y="828">of Open Type Features (alternates, ligatures, positional </tspan><tspan x="0" y="864">numerals, case sensitive punctuation) to make design </tspan><tspan x="0" y="900">smooth and multi-script projects as exciting as a surf </tspan><tspan x="0" y="936">ride in the sunny vTarifa.</tspan></text>
